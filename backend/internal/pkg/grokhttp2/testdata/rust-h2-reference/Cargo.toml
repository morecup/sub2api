[package]
name = "rust-h2-reference"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
h2 = "=0.4.15"
hex = "=0.4.3"
http = "=1.4.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
tokio = { version = "=1.52.3", features = ["io-util", "macros", "rt"] }
